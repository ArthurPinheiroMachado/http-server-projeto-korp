services:
  http-server-projeto-korp:
    image: http-server-projeto-korp:latest
    build:
      context: ./http-server-projeto-korp
      dockerfile: Dockerfile
    container_name: http-server-projeto-korp
    environment:
      - HTTP_PORT=8080
      - TIMEOUT_TIME=3
      - PROJECT_NAME=Projeto Korp
    networks:
      - korp-network

  nginx:
    image: nginx
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - korp-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/config/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - korp-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - korp-network

volumes:
  prometheus-data:
  grafana-data:

networks:
  korp-network:
    external: true