services:
  nginx:
    image: nginx
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - korp-network

  http-server-projeto-korp:
    image: http-server-projeto-korp:latest
    container_name: http-server-projeto-korp
    environment:
      - HTTP_PORT=8080
      - TIMEOUT_TIME=3
      - PROJECT_NAME=Projeto Korp
    networks:
      - korp-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/config/rules:/etc/prometheus/rules:ro
    networks:
      - korp-network

networks:
  korp-network: